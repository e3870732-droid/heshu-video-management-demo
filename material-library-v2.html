function scriptBody(s){return `<div class="body-copy"><p>${s.bodyIntro}</p><p>就比如说现在很多家长，因为网上各种数学英语的广告满天飞，然后就过分地偏重于数学和英语，导致学前，对语文基本功的重视不够。那上了小学识字量连 500 个都没有，结果一到 1 年级，课上听不懂，课下学不会。直接起步落后同学一大截；</p><p>那还有些家长，还停留在自己的认知经验里。想着英语我二三十年前也学过，我初一才开始学，我照样高考 140 多分，我根本不用搞。然后就错过了语言黄金期，后面醒悟过来了，发现是过程痛苦效果又差。而且这个时候其他学科的压力也上来了，就更手忙脚乱。</p><p>所以这就是为什么过去三年，我们规划营近10 万家长上完课以后，说的最多的四个字，就叫做相见恨晚。因为我们是第一次用简单的一张图，就给你把孩子从0 到 18 岁每一个阶段，语数英加上兴趣班，什么时间该做什么，94个关键点，84个避坑点，做了完整，系统的梳理。</p><p>担心大家看不懂，我还准备了三天的教育规划精华课，把这些节奏、关键点、避坑点的底层逻辑，一次性给你讲清楚，就三个晚上，咱们就安安心心的来听一听，把教育的基本认知拉到位，听完你就会发现，那些碎片的，割韭菜的信息，再也骗不到你了，赶紧点进来直播间听一听。</p></div>`}

<script>
can=function(action){const map={

};return (map[state.role]||map.director).includes(action)};

 const raw=s.id===1?[

  {id:'raw-2-2',name:'A005C167_250706ZD.MP4',meta:['会议室讲台','相机','侧机位'],size:'1.08 GB'}
 ];
 const finished=s.id===1?[
  {id:'finished-1-1',name:'知道不知道迭代版+会议室讲台+0515手机拍+绿色polo衫电子屏站+早了解少踩坑5.19+SY+TLCP.mp4',editor:'思远',date:'2026-05-09',duration:'01:58'},
  {id:'finished-1-2',name:'知道不知道-A-审核版.mp4',editor:'绚丽',date:'2026-05-13',duration:'02:04'}
 ]:[

  {id:'finished-2-2',name:'知道不知道-B-投放版.mp4',editor:'绚丽',date:'2026-05-15',duration:'01:51'}

 return type==='raw'?raw:finished;
}

 {id:'raw-1-1',name:'IMG_1970.MOV',scene:'会议室',device:'手机',position:'',meta:['镜号 1970'],size:'1.19 GB'},
 {id:'raw-1-2',name:'IMG_1968.MOV',scene:'会议室',device:'手机',position:'',meta:[],size:'832 MB'},

 {id:'raw-2-1',name:'A005C169_250706JJ.MP4',scene:'会议室',device:'相机',position:'侧机位',meta:['镜号 C169'],size:'1.46 GB'},
 {id:'raw-2-2',name:'A005C167_250706ZD.MP4',scene:'会议室',device:'相机',position:'侧机位',meta:[],size:'1.08 GB'},
 {id:'raw-3-1',name:'C0269.MP4',scene:'会议室',device:'相机',position:'正机位',meta:['镜号 C0269'],size:'1.32 GB'},
 {id:'raw-4-1',name:'DSC_0515_A.MP4',scene:'笔架山公园',device:'相机',position:'正机位',meta:['拍摄日期 2025-05-15'],size:'1.72 GB'},
 {id:'raw-4-2',name:'IMG_2146.MOV',scene:'笔架山公园',device:'手机',position:'侧机位',meta:['拍摄日期 2025-05-15'],size:'764 MB'}

function assetPill(value,type){const classes={投流:'usage-paid',主页:'usage-home',抖音:'platform-douyin',小红书:'platform-red',视频号:'platform-video',全平台:'platform-all'};return `<span class="asset-pill ${classes[value]||'platform-all'}">${value}</span>`}
function assetPlatformValues(t){const values=t.platforms||[];return values.includes('全平台')||values.length>=3?['全平台']:values}
function assetShootSummary(s){return [['场景',s.scene],['设备',s.device],['机位',s.position],['姿势',s.action],['服装',s.clothing],['道具',s.prop],['镜号',s.shot],['音频',s.audio]].filter(([,v])=>v!==undefined&&v!==null&&String(v).trim()&&!['—','待补充','未识别'].includes(String(v).trim())).map(([k,v])=>`<span>${['场景','设备','机位','姿势','服装','道具'].includes(k)?v:`${k} ${v}`}</span>`).join('')}
function assetFullScript(s){return `<div class="asset-script-reading"><section class="asset-reading-block"><h3>标题</h3><ol class="asset-title-list"><li>被保送北大的省状元：别再花冤枉钱搞鸡娃</li><li>学习学得痛苦还是开心？取决于家长的认知</li></ol></section><section class="asset-reading-block"><h3>开头</h3><div class="asset-body-copy"><p>想不想不用自己鸡，孩子就能自己卷，不用砸钱，孩子就能稳上重本？我作为一个高考省状元，可以非常负责任地说，想要达到这个效果真的不难。尤其是今天这样一个时代——</p></div></section><section class="asset-reading-block"><h3>正文</h3><div class="asset-body-copy">${scriptBody(s).replace('body-copy','')}</div></section></div>`}
function assetPreviewSource(){return ''}
function assetRawCard(x,selectable){const checked=(state.assetRawSelected||[]).includes(x.id);return `<article class="asset-raw-card ${checked?'is-selected':''}" data-raw-card="${x.id}" data-raw-group="${x.scene}::${x.device}::${x.position}">${selectable?`<input class="asset-raw-check" type="checkbox" value="${x.id}" aria-label="选择 ${x.name}" ${checked?'checked':''}>`:''}<button class="asset-video-thumb" type="button" data-media-preview="${x.name}" data-media-meta="${[x.scene,x.device,x.position,...x.meta].filter(Boolean).join(' · ')}"><video muted preload="metadata" src="${assetPreviewSource()}"></video><span class="asset-video-play">▶</span></button><div class="asset-raw-info"><strong title="${x.name}">${x.name}</strong>${x.meta.length?`<div class="asset-raw-meta">${x.meta.map(v=>`<span>${v}</span>`).join('')}</div>`:''}<div class="asset-raw-foot"><span>${x.size}</span>${can('downloadRaw')?`<button class="btn text" data-download="原片 ${x.name}">下载</button>`:''}</div></div></article>`}
function assetRawCards(){const rows=assetAllRaw(),selectable=can('downloadRaw'),scenes=[...new Set(rows.map(x=>x.scene||'其他原片'))];return `<div class="asset-media-toolbar">${selectable?`<div class="asset-media-select"><label><input type="checkbox" id="assetSelectAllRaw">全选</label><span id="assetSelectedCount">已选 0 项</span></div><button class="btn ghost asset-download-selected" id="assetDownloadSelected" disabled>⇩ 下载所选</button>`:'<span class="readonly">点击画面预览原片</span>'}</div>${scenes.map(scene=>{const sceneRows=rows.filter(x=>(x.scene||'其他原片')===scene),groups=[...new Set(sceneRows.map(x=>`${x.device||''}::${x.position||''}`))];return `<section class="asset-scene-group"><div class="asset-scene-head"><h4>${scene}<span class="asset-count">（${sceneRows.length}个）</span></h4></div>${groups.map(group=>{const [device,position]=group.split('::'),items=sceneRows.filter(x=>`${x.device||''}::${x.position||''}`===group),groupKey=`${scene}::${device}::${position}`,label=[device,position].filter(Boolean).join(' · ')||'其他原片';return `<section class="asset-device-group"><div class="asset-device-head"><h5>${label}<span class="asset-count">（${items.length}个）</span></h5>${selectable?`<label class="asset-group-select"><input type="checkbox" data-select-raw-group="${groupKey}">全选</label>`:''}</div><div class="asset-raw-grid">${items.map(x=>assetRawCard(x,selectable)).join('')}</div></section>`}).join('')}</section>`}).join('')}`}
function assetFinishedCards(s){const rows=assetFiles(s,'finished'),selectable=can('downloadFinished');return `<div class="asset-media-toolbar">${selectable?`<div class="asset-media-select"><label><input type="checkbox" id="assetSelectAllFinished">全选</label><span id="assetFinishedSelectedCount">已选 0 项</span></div><button class="btn ghost asset-download-selected" id="assetDownloadFinished" disabled>⇩ 下载所选</button>`:'<span class="readonly">点击画面预览成片</span>'}</div><div class="asset-finished-list">${rows.map(x=>`<article class="asset-finished-card" data-finished-card="${x.id}">${selectable?`<input class="asset-finished-check" type="checkbox" value="${x.id}" aria-label="选择 ${x.name}">`:''}<button class="asset-finished-preview" type="button" data-media-preview="${x.name}" data-media-meta="剪辑师：${x.editor} · 剪辑日期：${x.date} · 时长：${x.duration}"><video muted preload="metadata" src="${assetPreviewSource()}"></video><span class="asset-video-play">▶</span></button><div class="asset-finished-info"><h4>${x.name}</h4><div class="asset-finished-meta"><span><b>剪辑师</b>${x.editor}</span><span><b>剪辑日期</b>${x.date}</span><span><b>时长</b>${x.duration}</span></div></div><div class="asset-finished-actions">${selectable?`<button class="btn text" data-download="成片 ${x.name}">下载</button>`:''}</div></article>`).join('')}</div>`}
function assetScriptContent(s){return `<div class="asset-section-head"><div><span class="asset-script-index">脚本 ${s.id}</span><h2>${s.fullName}</h2></div>${can('downloadScript')?`<button class="btn ghost" data-download="脚本 ${s.id}">⇩ 下载脚本</button>`:'<span class="readonly">仅可查看</span>'}</div><div class="asset-shoot-summary">${assetShootSummary(s)}</div>${assetFullScript(s)}<section class="asset-subsection"><div class="asset-subsection-title"><h3>原片<span class="asset-count">（${assetAllRaw().length}个）</span></h3></div>${assetRawCards()}</section><section class="asset-subsection"><div class="asset-subsection-title"><h3>成片<span class="asset-count">（${assetFiles(s,'finished').length}条）</span></h3></div>${assetFinishedCards(s)}</section>`}
renderDetail=function(){
 const t=state.topic;if(!t)return;if(!state.scriptId)state.scriptId=topicScripts[0].id;if(!Array.isArray(state.assetRawSelected))state.assetRawSelected=[];const s=topicScripts.find(x=>x.id===state.scriptId)||topicScripts[0];
 $('#crumb').innerHTML=`<button class="crumb-link" data-asset-home>素材库</button><span>/</span><strong>${t.name}</strong>`;
 $('#view').innerHTML=`<section class="asset-detail"><div class="asset-detail-nav"><button class="btn text asset-back" data-asset-home>← 返回素材库</button><span class="asset-mode-note">正式资产只读 · 切换脚本仅更新右侧脚本资产</span></div><div class="asset-workbench"><aside class="asset-left"><div class="asset-topic-parent"><small>当前选题</small><h2>${t.name}</h2><div class="asset-topic-count">${topicScripts.length} 份脚本 · ${t.raw} 个原片 · ${t.finished} 条成片</div></div><div class="asset-script-menu">${topicScripts.map(x=>`<button class="asset-script-option ${x.id===s.id?'on':''}" data-asset-script="${x.id}"><b>脚本 ${x.id}</b><span>${x.name}</span><small>${assetFiles(x,'raw').length} 个原片 · ${assetFiles(x,'finished').length} 条成片</small></button>`).join('')}</div></aside><section class="asset-right"><div class="asset-topic-info"><div class="asset-topic-info-head"><div><span class="readonly">选题信息</span><h1>${t.name}</h1></div><div class="asset-topic-actions">${can('downloadTopic')?'<button class="btn ghost" data-download="选题资料">⇩ 下载选题</button>':''}${can('appendRaw')||can('appendFinished')?'<button class="btn primary" id="appendAsset">＋ 追加素材</button>':''}</div></div><div class="asset-classification"><div class="asset-tag-group"><span class="asset-tag-label">用途</span>${t.usages.map(x=>assetPill(x,'usage')).join('')}</div><div class="asset-tag-group"><span class="asset-tag-label">平台</span>${assetPlatformValues(t).map(x=>assetPill(x,'platform')).join('')}</div></div><div class="asset-facts">${[['业务线',t.line],['产品线',t.product],['出镜 IP',t.ip||'不区分 IP'],['编导',t.director],['迭代来源','知道不知道']].map(([k,v])=>`<div class="asset-fact"><b>${k}</b><span>${v}</span></div>`).join('')}</div></div><div class="asset-script-scroll">${assetScriptContent(s)}</div></section></div></section>`;
 $$('[data-asset-home]').forEach(e=>e.onclick=()=>{state.topic=null;state.scriptId=null;state.assetRawSelected=[];state.view='library';state.libraryTabOpen=true;render()});
 $$('[data-asset-script]').forEach(e=>e.onclick=()=>{state.scriptId=Number(e.dataset.assetScript);renderDetail()});
 $$('[data-download]').forEach(e=>e.onclick=()=>toast(e.dataset.download+' 已加入下载'));
 $$('[data-media-preview]').forEach(e=>e.onclick=()=>openMediaPreview(e.dataset.mediaPreview,e.dataset.mediaMeta));
 const rawChecks=$$('.asset-raw-check'),groupChecks=$$('[data-select-raw-group]'),selectAll=$('#assetSelectAllRaw'),downloadSelected=$('#assetDownloadSelected'),selectedCount=$('#assetSelectedCount');
