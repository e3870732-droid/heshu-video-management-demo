<!doctype html>
<html lang="zh-CN" data-theme="cobalt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="合数流量运营支持系统视频管理 P0 交互原型，覆盖拍摄、原片、剪辑、审片、成片、内容素材复用与发布审核闭环。"
    />
    <title>视频管理 P0｜合数流量运营支持系统</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12.5" r="4"/></symbol>
      <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.6 8.5 11.4 7.5M8.6 15.5 20 8"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/><path d="M4 4v4.5h4.5M12 8v5l3 2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
      <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6V5a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v14a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></symbol>
    </svg>

    <div class="app-shell" id="appShell">
      <aside class="side-rail" id="sideRail" aria-label="视频管理导航">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">合</span>
          <div class="brand__copy">
            <strong>合数流量运营</strong>
            <span>视频生产工作台</span>
          </div>
        </div>

        <div class="scope-note">
          <span class="scope-note__signal" aria-hidden="true"></span>
          <span>P0 独立原型 · 演示数据</span>
        </div>

        <nav class="primary-nav" aria-label="主导航">
          <span class="nav-section-label">生产工作区</span>
          <button class="nav-item is-active" type="button" data-view="workbench" aria-current="page">
            <svg aria-hidden="true"><use href="#i-grid"></use></svg><span>我的工作台</span>
          </button>
          <button class="nav-item" type="button" data-view="topics">
            <svg aria-hidden="true"><use href="#i-file"></use></svg><span>选题脚本</span>
          </button>
          <button class="nav-item" type="button" data-view="shoots">
            <svg aria-hidden="true"><use href="#i-camera"></use></svg><span>拍摄任务</span><span class="nav-count" data-count="shoots">0</span>
          </button>
          <button class="nav-item" type="button" data-view="edits">
            <svg aria-hidden="true"><use href="#i-scissors"></use></svg><span>剪辑任务</span><span class="nav-count" data-count="edits">0</span>
          </button>
          <button class="nav-item" type="button" data-view="finals">
            <svg aria-hidden="true"><use href="#i-film"></use></svg><span>视频成片</span><span class="nav-count" data-count="finals">0</span>
          </button>
          <span class="nav-section-label">内容与资产</span>
          <button class="nav-item" type="button" data-view="materials">
            <svg aria-hidden="true"><use href="#i-layers"></use></svg><span>内容素材库</span><span class="nav-count" data-count="materials">0</span>
          </button>
          <button class="nav-item" type="button" data-view="raws">
            <svg aria-hidden="true"><use href="#i-folder"></use></svg><span>视频原片</span>
          </button>
        </nav>

        <div class="side-rail__foot">
          <button class="text-action" id="resetDemo" type="button">重置演示数据</button>
          <p>本原型不连接生产数据库与平台 API。</p>
        </div>
      </aside>

      <button class="mobile-scrim" id="mobileScrim" type="button" aria-label="关闭导航"></button>

      <div class="app-stage">
        <header class="topbar">
          <div class="topbar__start">
            <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="打开导航" aria-expanded="false">
              <svg aria-hidden="true"><use href="#i-menu"></use></svg>
            </button>
            <div class="breadcrumb" aria-label="当前位置">
              <span>视频管理</span><svg aria-hidden="true"><use href="#i-chevron"></use></svg><strong id="currentViewLabel">我的工作台</strong>
            </div>
          </div>

          <div class="topbar__actions">
            <label class="role-field">
              <span>当前角色</span>
              <select id="roleSelect" aria-label="切换当前角色">
                <option value="director">编导</option>
                <option value="editor">剪辑</option>
                <option value="buyer">投手</option>
                <option value="operator">运营</option>
              </select>
            </label>
            <button class="command-button" id="commandButton" type="button" aria-haspopup="dialog">
              <svg aria-hidden="true"><use href="#i-search"></use></svg><span>搜索任务</span><kbd>⌘ K</kbd>
            </button>
            <span class="user-avatar" title="演示用户">李</span>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div id="appView" aria-live="polite"></div>
        </main>

        <footer class="foot-line">
          <p>合数流量运营 · 视频管理 P0 · 交互原型 · 所有记录均为演示数据</p>
        </footer>
      </div>
    </div>

    <aside class="detail-drawer" id="detailDrawer" aria-hidden="true" aria-label="详情面板">
      <div class="drawer__header">
        <div>
          <span class="mono-label" id="drawerKicker">DETAIL</span>
          <h2 id="drawerTitle">任务详情</h2>
        </div>
        <button class="icon-button" id="closeDrawer" type="button" aria-label="关闭详情">
          <svg aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawerBody"></div>
    </aside>
    <button class="drawer-scrim" id="drawerScrim" type="button" aria-label="关闭详情"></button>

    <dialog class="app-dialog" id="appDialog" aria-labelledby="dialogTitle">
      <form method="dialog" id="dialogForm" novalidate>
        <div class="dialog__header">
          <div>
            <span class="mono-label" id="dialogKicker">CREATE</span>
            <h2 id="dialogTitle">新建任务</h2>
          </div>
          <button class="icon-button" value="cancel" formnovalidate aria-label="关闭对话框">
            <svg aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>
        <div class="dialog__body" id="dialogBody"></div>
        <div class="dialog__actions">
          <button class="button button--quiet" value="cancel" formnovalidate>取消</button>
          <button class="button button--primary" id="dialogSubmit" value="default">保存</button>
        </div>
      </form>
    </dialog>

    <dialog class="command-dialog" id="commandDialog" aria-labelledby="commandTitle">
      <div class="command-search">
        <svg aria-hidden="true"><use href="#i-search"></use></svg>
        <label class="sr-only" for="commandInput" id="commandTitle">搜索任务与功能</label>
        <input id="commandInput" type="search" autocomplete="off" placeholder="搜索任务、成片或输入功能名称" />
        <kbd>ESC</kbd>
      </div>
      <div class="command-results" id="commandResults" role="listbox" aria-label="搜索结果"></div>
    </dialog>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
    <div class="sr-only" id="statusAnnouncer" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
